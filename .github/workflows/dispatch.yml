name: dispatch-to-marketplace

# Manual recovery tool. The normal release flow (release.yml) dispatches to
# the marketplace itself. Use this only when:
#   - The marketplace dispatch step in release.yml failed and you want to
#     retry without re-running the whole build.
#   - You need to re-publish an existing release to the marketplace (e.g.
#     after the marketplace.json schema changed).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to dispatch (e.g. agent-chrome-wrapper--v0.0.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          TAG="${{ inputs.tag }}"
          # Tag format: <plugin-name>--v<version>. Strip everything up to and including "--v".
          VERSION="${TAG##*--v}"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release

      - name: Verify plugin.json version matches tag
        shell: bash
        run: |
          PJ_VERSION=$(jq -r '.version' .claude-plugin/plugin.json)
          TAG_VERSION="${{ steps.tag.outputs.version }}"
          if [ "$PJ_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::plugin.json on release branch is v$PJ_VERSION, but you asked to dispatch v$TAG_VERSION."
            echo "Re-run release.yml with version=$TAG_VERSION (or re-check the release branch state)."
            exit 1
          fi

      - name: Read plugin metadata from plugin.json
        id: meta
        shell: bash
        run: |
          DESC=$(jq -r '.description' .claude-plugin/plugin.json)
          NAME=$(jq -r '.name'        .claude-plugin/plugin.json)
          echo "description=${DESC}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}"        >> "$GITHUB_OUTPUT"

      - name: Fetch changelog for dispatch
        shell: bash
        env:
          GH_TOKEN:       ${{ secrets.GITHUB_TOKEN }}
          TAG:            ${{ steps.tag.outputs.tag }}
          CHANGELOG_FILE: ${{ runner.temp }}/changelog.md
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body -q '.body // empty' > "$CHANGELOG_FILE" 2>/dev/null || true

      - name: Dispatch to agent-marketplace
        env:
          GH_PAT:         ${{ secrets.MARKETPLACE_DISPATCH_TOKEN }}
          NAME:           ${{ steps.meta.outputs.name }}
          DESC:           ${{ steps.meta.outputs.description }}
          VERSION:        ${{ steps.tag.outputs.version }}
          TAG:            ${{ steps.tag.outputs.tag }}
          REPO:           ${{ github.repository }}
          CHANGELOG_FILE: ${{ runner.temp }}/changelog.md
          PAYLOAD_FILE:   ${{ runner.temp }}/payload.json
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os

          changelog_file = os.environ["CHANGELOG_FILE"]
          body = ""
          if os.path.exists(changelog_file):
              with open(changelog_file, "r", encoding="utf-8", newline="") as fh:
                  body = fh.read()

          TRUNCATE_LIMIT = 30000
          repo = os.environ["REPO"]
          tag = os.environ["TAG"]

          client_payload = {
              "name": os.environ["NAME"],
              "description": os.environ["DESC"],
              "repo": repo,
              "category": "mcp",
              "version": os.environ["VERSION"],
              "ref": tag,
              "icon": f"https://raw.githubusercontent.com/{repo}/{tag}/assets/icon.png",
              "description_url": f"https://raw.githubusercontent.com/{repo}/{tag}/description.md",
          }

          if body.strip():
              encoded = body.encode("utf-8")
              if len(encoded) > TRUNCATE_LIMIT:
                  truncated = encoded[:TRUNCATE_LIMIT].decode("utf-8", "ignore")
                  body = truncated + f"\n\n_… truncated. Full release notes: https://github.com/{repo}/releases/tag/{tag}_"
              client_payload["changelog"] = body
          else:
              print(f"::warning::No release body found for {tag}; dispatching without a changelog.")

          with open(os.environ["PAYLOAD_FILE"], "w", encoding="utf-8") as fh:
              json.dump(
                  {"event_type": "plugin-release", "client_payload": client_payload},
                  fh,
                  ensure_ascii=False,
              )
          PY
          curl -fsSL -X POST \
            -H "Authorization: Bearer $GH_PAT" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/Seretos/agent-marketplace/dispatches \
            -d @"$PAYLOAD_FILE"

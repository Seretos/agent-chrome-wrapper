[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chrome_wrapper_plugin"
version = "0.0.0"
description = "Provides an MCP that gives agents access to Chrome, starting a separate Chrome instance for each session."
requires-python = ">=3.11"
authors = [{ name = "Arne von Appen" }]
dependencies = [
  "mcp>=1.2,<3",
  "fastmcp>=2,<3",
  "websocket-client>=1.7",
  "pywin32>=306; sys_platform=='win32'",
]

[project.optional-dependencies]
build = [
  "pyinstaller>=6.10",
]
test = [
  "pytest>=8",
  "pyyaml>=6",
  "pytest-timeout>=2.3",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
# thread (not signal): SIGALRM is unavailable on Windows, and the thread
# method dumps every thread's stack before aborting -- that dump is the
# diagnostic payload we want. Do not "fix" this to signal.
timeout = 60
timeout_method = "thread"
